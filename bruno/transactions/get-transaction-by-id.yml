info:
    name: get-transaction-by-id
    type: http
    seq: 2

http:
    method: GET
    url: "{{baseUrl}}/api/asset-items/{{assetItemId}}/transactions/{{transactionId}}?currency=USD"
    params:
        - name: currency
          value: USD
          type: query
    auth:
        type: bearer
        token: "{{accessToken}}"

settings:
    encodeUrl: true
    timeout: 0
    followRedirects: true
    maxRedirects: 5
