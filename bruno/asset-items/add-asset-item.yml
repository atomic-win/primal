info:
    name: add-asset-item
    type: http
    seq: 1

http:
    method: POST
    url: "{{baseUrl}}/api/asset-items"
    body:
        type: json
        data: |-
            {
              "name": "Apple Inc.",
              "assetClass": "Equity",
              "assetType": "Stock",
              "externalId": "AAPL",
              "currency": "USD"
            }
    auth:
        type: bearer
        token: "{{accessToken}}"

settings:
    encodeUrl: true
    timeout: 0
    followRedirects: true
    maxRedirects: 5
