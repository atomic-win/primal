info:
    name: update-user
    type: http
    seq: 2

http:
    method: PATCH
    url: "{{baseUrl}}/api/users/me"
    body:
        type: json
        data: |-
            {
              "preferredCurrency": "USD",
              "preferredLocale": "en-US"
            }
    auth:
        type: bearer
        token: "{{accessToken}}"

settings:
    encodeUrl: true
    timeout: 0
    followRedirects: true
    maxRedirects: 5
